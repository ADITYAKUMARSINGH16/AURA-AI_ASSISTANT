<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="AURA 2.0 Unified System Architecture Diagram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <style>
      .title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #f8fafc; letter-spacing: 1.5px; }
      .subtitle { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 12px; fill: #94a3b8; letter-spacing: 0.6px; }
      .layer-label { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 1.8px; }
      .box-title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .box-sub { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 11px; fill: #94a3b8; }
      .box-detail { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .badge { font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bgGrad)"/>
  <rect width="1200" height="820" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="30" y="20" width="1140" height="62" rx="10" fill="#0b1324" stroke="#1e3a5f" stroke-width="1.2"/>
  <circle cx="58" cy="51" r="8" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="58" cy="51" r="3" fill="#22d3ee"/>
  <text x="80" y="47" class="title">AURA 2.0 — UNIFIED SYSTEM ARCHITECTURE</text>
  <text x="80" y="66" class="subtitle">Autonomous Utility &amp; Response Agent • FastAPI + SSE Event Bus + Multi-Provider LLM + Local Vision, Voice, RAG &amp; MCP</text>

  <!-- LAYER 1: INTERFACES -->
  <text x="36" y="110" class="layer-label">01 // USER INTERFACES &amp; ENTRYPOINTS</text>

  <rect x="30" y="120" width="360" height="88" rx="10" fill="url(#cyanGlow)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="48" y="144" class="box-title">Cinematic Landing Page</text>
  <text x="48" y="162" class="box-sub">/  &amp;  /welcome  →  static/welcome.html</text>
  <text x="48" y="180" class="box-detail">Three.js Reactor • 3D Parallax • Live Telemetry Bar</text>
  <text x="48" y="196" class="box-detail">Interactive Terminal • Feature Hover Mini-Demos</text>

  <rect x="420" y="120" width="360" height="88" rx="10" fill="url(#cyanGlow)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="438" y="144" class="box-title">Tactical Command HUD</text>
  <text x="438" y="162" class="box-sub">/hud  →  static/hud.html + realtime.js</text>
  <text x="438" y="180" class="box-detail">4 Themes • Ctrl+K Spotlight • Security Clearance Gate</text>
  <text x="438" y="196" class="box-detail">Live SSE Diagnostics • Audio Visualizer • Streaming Chat</text>

  <rect x="810" y="120" width="360" height="88" rx="10" fill="#0d1729" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="828" y="144" class="box-title">System Tray &amp; CLI Mode</text>
  <text x="828" y="162" class="box-sub">tray.py (pystray)  |  main.py (CLI)</text>
  <text x="828" y="180" class="box-detail">start_aura.bat Admin Launcher • Background Daemon</text>
  <text x="828" y="196" class="box-detail">Proactive Alerts &amp; Terminal Voice/Text Loop</text>

  <!-- Arrows L1 -> L2 -->
  <line x1="210" y1="208" x2="210" y2="246" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <line x1="600" y1="208" x2="600" y2="246" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <line x1="990" y1="208" x2="990" y2="246" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- LAYER 2: API & REAL-TIME BACKEND -->
  <text x="36" y="240" class="layer-label">02 // API SERVER, REAL-TIME EVENT BUS &amp; SAFETY</text>

  <rect x="30" y="250" width="560" height="96" rx="10" fill="#0d182b" stroke="#0ea5e9" stroke-width="1.3"/>
  <text x="48" y="274" class="box-title">FastAPI Server &amp; Lifecycle Detectors (api.py)</text>
  <text x="48" y="292" class="box-sub">/api/chat  •  /api/chat/stream  •  /api/events (SSE)  •  /api/settings/env</text>
  <text x="48" y="310" class="box-detail">10 Background Async Detectors: telemetry, threats, permissions, notifications,</text>
  <text x="48" y="326" class="box-detail">logs, schedule, processes, security, ambient context, media state</text>

  <rect x="610" y="250" width="270" height="96" rx="10" fill="#0d182b" stroke="#34d399" stroke-width="1.2"/>
  <text x="628" y="274" class="box-title">SSE Event Bus</text>
  <text x="628" y="292" class="box-sub">backend/event_bus.py</text>
  <text x="628" y="310" class="box-detail">Thread-safe publish_now()</text>
  <text x="628" y="326" class="box-detail">Push updates to HUD clients</text>

  <rect x="900" y="250" width="270" height="96" rx="10" fill="#1a1225" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="918" y="274" class="box-title">Permission Gate</text>
  <text x="918" y="292" class="box-sub">permissions.py</text>
  <text x="918" y="310" class="box-detail">SAFE / LOW / MEDIUM / HIGH / CRIT</text>
  <text x="918" y="326" class="box-detail">HUD Clearance &amp; Trusted Mode</text>

  <!-- Arrows L2 -> L3 -->
  <line x1="310" y1="346" x2="310" y2="386" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowViolet)"/>
  <line x1="745" y1="346" x2="745" y2="386" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <line x1="1035" y1="346" x2="1035" y2="386" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowViolet)"/>

  <!-- LAYER 3: COGNITIVE CORE & LLM ROUTER -->
  <text x="36" y="380" class="layer-label">03 // COGNITIVE ENGINE, INTENT ROUTER &amp; LLM PROVIDERS</text>

  <rect x="30" y="390" width="460" height="114" rx="10" fill="url(#violetGlow)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="48" y="415" class="box-title">Agent Core &amp; Intent Router (agent.py)</text>
  <text x="48" y="434" class="box-sub">analyze_intent() → 12 Categories + Dynamic Tool Subsetting</text>
  <text x="48" y="454" class="box-detail">• Classifies CHAT, VISION, SYSTEM, COMPUTER_CONTROL, FILE,</text>
  <text x="48" y="470" class="box-detail">  WEB_RESEARCH, MEMORY, SMART_HOME, SECURITY, PLANNER, CODE</text>
  <text x="48" y="486" class="box-detail">• Flags is_simple, is_dangerous, requires_plan &amp; active_skill</text>

  <rect x="510" y="390" width="250" height="114" rx="10" fill="#13162b" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="528" y="415" class="box-title">Skill Registry</text>
  <text x="528" y="434" class="box-sub">skill_registry.py</text>
  <text x="528" y="454" class="box-detail">Loads skills/*/skill.json</text>
  <text x="528" y="470" class="box-detail">• browser  • coding</text>
  <text x="528" y="486" class="box-detail">• system   • servers</text>

  <rect x="780" y="390" width="390" height="114" rx="10" fill="#0d182b" stroke="#22d3ee" stroke-width="1.3"/>
  <text x="798" y="415" class="box-title">Multi-Provider LLM Router (llm_provider.py)</text>
  <text x="798" y="434" class="box-sub">AURA_LLM_PROVIDER  (Default: ollama)</text>
  <text x="798" y="454" class="box-detail">Local:  Ollama (gemma4:e2b + qwen3-vl:4b)</text>
  <text x="798" y="470" class="box-detail">Cloud:  Groq • NVIDIA NIM • Google Gemini</text>
  <text x="798" y="486" class="box-detail">        OpenAI • OpenRouter (OpenAI-compat)</text>

  <!-- Arrows L3 -> L4 -->
  <line x1="130" y1="504" x2="130" y2="544" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <line x1="360" y1="504" x2="360" y2="544" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <line x1="600" y1="504" x2="600" y2="544" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <line x1="840" y1="504" x2="840" y2="544" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <line x1="1070" y1="504" x2="1070" y2="544" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowViolet)"/>

  <!-- LAYER 4: SUBSYSTEMS & TOOLS -->
  <text x="36" y="538" class="layer-label">04 // MODULAR SUBSYSTEMS, TOOLS &amp; EXTERNAL BRIDGES</text>

  <!-- Row 1 of Subsystems -->
  <rect x="30" y="550" width="365" height="114" rx="10" fill="#0c1526" stroke="#38bdf8" stroke-width="1.1"/>
  <text x="48" y="574" class="box-title">Vision &amp; Desktop Automation</text>
  <text x="48" y="592" class="box-sub">vision.py • computer_control_tools.py • uia_tools.py</text>
  <text x="48" y="612" class="box-detail">• Qwen3-VL 4B closed-loop visual agent</text>
  <text x="48" y="628" class="box-detail">• Tesseract OCR + pyautogui mouse/keyboard</text>
  <text x="48" y="644" class="box-detail">• Windows UI Automation (UIA) element control</text>

  <rect x="417" y="550" width="365" height="114" rx="10" fill="#0c1526" stroke="#38bdf8" stroke-width="1.1"/>
  <text x="435" y="574" class="box-title">Voice &amp; Wake-Word Pipeline</text>
  <text x="435" y="592" class="box-sub">voice.py • models/hey_aura.onnx</text>
  <text x="435" y="612" class="box-detail">• Wake Word: Local OpenWakeWord ("Hey Aura")</text>
  <text x="435" y="628" class="box-detail">• STT: faster-whisper (local) or Google STT</text>
  <text x="435" y="644" class="box-detail">• TTS: Kokoro (local) or Edge-TTS / pyttsx3</text>

  <rect x="804" y="550" width="366" height="114" rx="10" fill="url(#emeraldGlow)" stroke="#10b981" stroke-width="1.1"/>
  <text x="822" y="574" class="box-title">Memory, Desktop RAG &amp; Ambient</text>
  <text x="822" y="592" class="box-sub">memory.py • rag_tools.py • ambient_sentinel.py</text>
  <text x="822" y="612" class="box-detail">• Session (memory.json) &amp; LTM (ltm_db.json)</text>
  <text x="822" y="628" class="box-detail">• Local Desktop RAG (desktop_rag.db)</text>
  <text x="822" y="644" class="box-detail">• Passive foreground window &amp; clipboard context</text>

  <!-- Row 2 of Subsystems -->
  <rect x="30" y="680" width="365" height="114" rx="10" fill="#0c1526" stroke="#64748b" stroke-width="1.1"/>
  <text x="48" y="704" class="box-title">Planner, Goals &amp; Code Execution</text>
  <text x="48" y="722" class="box-sub">planner_state.py • goal_tools.py • interpreter_tools.py</text>
  <text x="48" y="742" class="box-detail">• Multi-step task plans (plans.json)</text>
  <text x="48" y="758" class="box-detail">• Persistent goals (goals.json) &amp; schedule.json</text>
  <text x="48" y="774" class="box-detail">• Sandboxed Python code execution tool</text>

  <rect x="417" y="680" width="365" height="114" rx="10" fill="#0c1526" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="435" y="704" class="box-title">Windows OS Telemetry &amp; Security</text>
  <text x="435" y="722" class="box-sub">windows_tools.py • security_tools.py • system_tools.py</text>
  <text x="435" y="742" class="box-detail">• psutil, WMI, WinReg CPU/GPU/RAM/Disk/Net</text>
  <text x="435" y="758" class="box-detail">• Listening ports, firewall, Defender, threat scans</text>
  <text x="435" y="774" class="box-detail">• Process analyzer, startup items &amp; event logs</text>

  <rect x="804" y="680" width="366" height="114" rx="10" fill="#13162b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="822" y="704" class="box-title">MCP Client &amp; External Integrations</text>
  <text x="822" y="722" class="box-sub">mcp/client.py • mcp_servers.json • smart_home_tools.py</text>
  <text x="822" y="742" class="box-detail">• Stdio JSON-RPC 2.0 MCP tool discovery &amp; calls</text>
  <text x="822" y="758" class="box-detail">• WiZ Smart Home UDP mesh discovery &amp; scenes</text>
  <text x="822" y="774" class="box-detail">• Spotify playback/search &amp; Web Research</text>
</svg>
